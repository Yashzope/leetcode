
name: Organize LeetHub Uploads

on:
  push:
    branches:
      - main
    paths:
      - "LeetCode/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-leethub
  cancel-in-progress: false

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Move uploaded solutions safely
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          source_root = Path("LeetCode")

          if not source_root.is_dir():
              print("No LeetCode upload directory found.")
              sys.exit(0)

          if source_root.is_symlink():
              sys.exit("Unsafe LeetCode directory.")

          sources = sorted(
              p for p in source_root.iterdir()
              if p.is_dir() and not p.is_symlink()
          )

          if not sources:
              print("No problem folders to organize.")
              sys.exit(0)

          # Validate all paths before changing anything.
          for source in sources:
              destination = Path(source.name)

              if destination.is_symlink() or (
                  destination.exists() and not destination.is_dir()
              ):
                  sys.exit(f"Unsafe destination: {destination}")

              for item in source.rglob("*"):
                  if item.is_symlink():
                      sys.exit(f"Symlink not allowed: {item}")

                  if not item.is_file():
                      continue

                  target = destination / item.relative_to(source)
                  current = Path(".")

                  for part in target.parent.parts:
                      current = current / part
                      if current.is_symlink() or (
                          current.exists() and not current.is_dir()
                      ):
                          sys.exit(f"Unsafe destination: {current}")

                  if target.is_symlink():
                      sys.exit(f"Unsafe target: {target}")

          # Move new files; skip identical files; preserve conflicts.
          for source in sources:
              destination = Path(source.name)

              for item in sorted(source.rglob("*")):
                  if not item.is_file():
                      continue

                  target = destination / item.relative_to(source)

                  if target.exists():
                      if (
                          target.is_file()
                          and target.read_bytes() == item.read_bytes()
                      ):
                          item.unlink()
                          print(f"Skipped identical file: {target}")
                      else:
                          print(f"CONFLICT - Preserved: {item}")
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(item), str(target))
                  print(f"Moved: {item} -> {target}")

              # Remove empty directories only.
              for directory in sorted(
                  (p for p in source.rglob("*") if p.is_dir()),
                  key=lambda p: len(p.parts),
                  reverse=True
              ):
                  try:
                      directory.rmdir()
                  except OSError:
                      pass

              try:
                  source.rmdir()
              except OSError:
                  print(f"Preserved remaining files: {source}")

          if source_root.is_dir() and not any(source_root.iterdir()):
              source_root.rmdir()

          print("Organization completed.")

          PY

      - name: Commit organized solutions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to organize."
            exit 0
          fi

          git commit -m "Organize LeetHub uploads [skip ci]"
          git push
