
name: Organize LeetHub Uploads

on:
  push:
    branches:
      - main
    paths:
      - "LeetCode/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-leethub
  cancel-in-progress: false

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Organize and version solutions
        shell: bash
        run: |
          python - <<'PY'
          import re
          import shutil
          import sys
          from pathlib import Path

          source_root = Path("LeetCode")

          if not source_root.exists():
              print("No LeetCode upload directory found.")
              sys.exit(0)

          if source_root.is_symlink() or not source_root.is_dir():
              sys.exit("Unsafe LeetCode directory.")

          sources = sorted(
              p for p in source_root.iterdir()
              if p.is_dir()
          )

          # Validate all incoming paths before making changes.
          for source in sources:
              if source.is_symlink():
                  sys.exit(f"Unsafe source: {source}")

              destination = Path(source.name)

              if destination.is_symlink():
                  sys.exit(f"Unsafe destination: {destination}")

              if destination.exists() and not destination.is_dir():
                  sys.exit(f"Destination is not a folder: {destination}")

              for item in source.rglob("*"):
                  if item.is_symlink():
                      sys.exit(f"Symlink not allowed: {item}")

                  if not item.is_file():
                      continue

                  target = destination / item.relative_to(source)

                  current = Path(".")
                  for part in target.parent.parts:
                      current = current / part
                      if current.is_symlink():
                          sys.exit(f"Unsafe destination: {current}")
                      if current.exists() and not current.is_dir():
                          sys.exit(f"Invalid destination: {current}")

                  if target.is_symlink():
                      sys.exit(f"Unsafe target: {target}")

                  if target.exists() and not target.is_file():
                      sys.exit(f"Target is not a file: {target}")

          # Move files and preserve previous Solution.py versions.
          for source in sources:
              destination = Path(source.name)

              for item in sorted(source.rglob("*")):
                  if not item.is_file():
                      continue

                  target = destination / item.relative_to(source)
                  target.parent.mkdir(parents=True, exist_ok=True)

                  if target.exists():
                      if target.read_bytes() == item.read_bytes():
                          item.unlink()
                          print(f"Skipped identical file: {target}")
                          continue

                      if item.name == "Solution.py":
                          versions = []

                          for old in destination.glob("Solution_v*.py"):
                              match = re.fullmatch(
                                  r"Solution_v(\d+)\.py", old.name
                              )
                              if match:
                                  if old.is_symlink():
                                      sys.exit(f"Unsafe version: {old}")
                                  versions.append(int(match.group(1)))

                          next_version = max(versions, default=0) + 1
                          archive = destination / (
                              f"Solution_v{next_version}.py"
                          )

                          while archive.exists() or archive.is_symlink():
                              next_version += 1
                              archive = destination / (
                                  f"Solution_v{next_version}.py"
                              )

                          shutil.move(str(target), str(archive))
                          print(f"Archived previous solution: {archive}")

                          shutil.move(str(item), str(target))
                          print(f"Installed latest solution: {target}")
                          continue

                      print(f"CONFLICT - Preserved incoming file: {item}")
                      continue

                  shutil.move(str(item), str(target))
                  print(f"Moved: {item} -> {target}")

              # Remove empty directories only.
              for directory in sorted(
                  (p for p in source.rglob("*") if p.is_dir()),
                  key=lambda p: len(p.parts),
                  reverse=True
              ):
                  try:
                      directory.rmdir()
                  except OSError:
                      pass

              try:
                  source.rmdir()
              except OSError:
                  print(f"Preserved remaining files: {source}")

          if source_root.is_dir() and not any(source_root.iterdir()):
              source_root.rmdir()

          print("Organization and versioning completed.")
          PY

      - name: Commit organized solutions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to organize."
            exit 0
          fi

          git commit -m "Organize and version LeetHub uploads [skip ci]"
          git push
